<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de CV Premium - PrestaDDOr</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div class="max-w-4xl mx-auto my-8 p-6 sm:p-8 bg-white rounded-2xl shadow-xl border border-slate-100">
        <div class="flex items-center justify-between mb-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">📄 Generador de CV Premium</h1>
                <p class="text-slate-500 text-xs sm:text-sm mt-1">Completa tus datos profesionales y genera tu currículum en alta calidad listo para imprimir o guardar.</p>
            </div>
            <a href="/" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                <span>⬅️ Volver al Sistema</span>
            </a>
        </div>
        
        <form action="/generar-cv" method="POST" class="space-y-6">
            <!-- Selección de Plantilla -->
            <div class="bg-slate-50 p-5 rounded-xl border border-slate-200">
                <label class="block text-xs font-black uppercase tracking-wider text-slate-700 mb-3">1. Seleccioná tu diseño de plantilla premium</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                    <label class="relative flex flex-col p-3.5 bg-white border-2 border-indigo-600 rounded-xl cursor-pointer shadow-sm hover:border-indigo-700 transition">
                        <input type="radio" name="plantilla" value="minimalista" checked class="absolute top-3 right-3 accent-indigo-600">
                        <span class="font-bold text-slate-900 text-xs">✨ Minimalista</span>
                        <span class="text-[10px] text-slate-500 mt-1">Limpio, con tipografía elegante en 1 columna.</span>
                    </label>
                    <label class="relative flex flex-col p-3.5 bg-white border border-slate-200 rounded-xl cursor-pointer shadow-sm hover:border-indigo-600 transition">
                        <input type="radio" name="plantilla" value="ejecutivo" class="absolute top-3 right-3 accent-indigo-600">
                        <span class="font-bold text-slate-900 text-xs">💼 Ejecutivo</span>
                        <span class="text-[10px] text-slate-500 mt-1">Corporativo con barra lateral y alto impacto.</span>
                    </label>
                    <label class="relative flex flex-col p-3.5 bg-white border border-slate-200 rounded-xl cursor-pointer shadow-sm hover:border-indigo-600 transition">
                        <input type="radio" name="plantilla" value="creativa" class="absolute top-3 right-3 accent-indigo-600">
                        <span class="font-bold text-slate-900 text-xs">🎨 Creativo</span>
                        <span class="text-[10px] text-slate-500 mt-1">Estilo visual dinámico y moderno.</span>
                    </label>
                    <label class="relative flex flex-col p-3.5 bg-white border border-slate-200 rounded-xl cursor-pointer shadow-sm hover:border-indigo-600 transition">
                        <input type="radio" name="plantilla" value="tecnologica" class="absolute top-3 right-3 accent-indigo-600">
                        <span class="font-bold text-slate-900 text-xs">💻 Tecnológico</span>
                        <span class="text-[10px] text-slate-500 mt-1">Formato ideal para IT y desarrolladores.</span>
                    </label>
                </div>
            </div>

            <!-- Datos Personales -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Nombre Completo</label>
                    <input type="text" name="nombre" placeholder="Ej. Carlos Gardel" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Puesto / Título Profesional</label>
                    <input type="text" name="puesto" placeholder="Ej. Senior Python Developer" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Correo Electrónico</label>
                    <input type="email" name="email" placeholder="carlos@email.com" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Teléfono</label>
                    <input type="tel" name="telefono" placeholder="+54 11 1234-5678" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Enlace / LinkedIn</label>
                    <input type="text" name="linkedin" placeholder="://linkedin.com" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                </div>
            </div>

            <!-- Bloques de Texto -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Sobre Mí / Resumen Ejecutivo</label>
                <textarea name="sobre_mi" rows="3" placeholder="Breve introducción sobre tu perfil profesional..." class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Experiencia Laboral</label>
                <textarea name="experiencia" rows="4" placeholder="• Empresa A - Cargo (Año - Actualidad)&#10;  Descripción de logros y tareas principales..." class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg font-mono text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Educación</label>
                    <textarea name="educacion" rows="3" placeholder="• Universidad - Carrera (Año)" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Habilidades / Tecnologías</label>
                    <textarea name="habilidades" rows="3" placeholder="Ej. Python, Django, REST APIs, SQL, Git" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"></textarea>
                </div>
            </div>

            <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-100 transition duration-200 text-center block cursor-pointer">
                🚀 Generar y Descargar CV PDF Gratis
            </button>
        </form>
    </div>
</body>
</html>
